        <!-- TABLE AREA -->
        <section id="table-area">
            <div id="sheet-scroll">
                <table id="data-table"></table>
                <div id="chart-windows"></div>
            </div>
            <aside id="chart-settings-panel" class="chart-settings-panel" hidden>
                <div id="chart-settings-titlebar" class="chart-titlebar">
                    <span id="chart-settings-title" class="chart-window-title">Grafik Ayarlar</span>
                    <div class="chart-window-actions">
                        <button id="chart-settings-close-btn" type="button" title="Kapat">×</button>
                    </div>
                </div>
                <div class="chart-settings-body">
                    <label class="chart-settings-field">
                        <span>Grafik Başlığı</span>
                        <input id="chart-settings-title-input" type="text" placeholder="Grafik başlığı" />
                    </label>
                    <div class="chart-settings-field">
                        <span>Grafik Türü</span>
                        <div id="chart-settings-type" class="chart-type-combobox">
                            <button id="chart-settings-type-btn" class="chart-type-selected" type="button"
                                aria-haspopup="listbox" aria-expanded="false">
                                <img src="icons/addgraph.svg" alt="" />
                                <span>Sütun</span>
                            </button>
                            <div id="chart-settings-type-menu" class="chart-type-menu" role="listbox" hidden>
                                <button type="button" role="option" data-chart-type="bar">
                                    <img src="icons/addgraph.svg" alt="" />
                                    <span>Sütun</span>
                                </button>
                                <button type="button" role="option" data-chart-type="line">
                                    <img src="icons/chart-line.svg" alt="" />
                                    <span>Çizgi</span>
                                </button>
                                <button type="button" role="option" data-chart-type="pie">
                                    <img src="icons/chart-pie.svg" alt="" />
                                    <span>Pasta</span>
                                </button>
                                <button type="button" role="option" data-chart-type="scatter">
                                    <img src="icons/chart-scatter.svg" alt="" />
                                    <span>Saçılım</span>
                                </button>
                                <button type="button" role="option" data-chart-type="horizontalBar">
                                    <img src="icons/chart-bar-horizontal.svg" alt="" />
                                    <span>Yatay Çubuk</span>
                                </button>
                                <button type="button" role="option" data-chart-type="area">
                                    <img src="icons/chart-area.svg" alt="" />
                                    <span>Alan</span>
                                </button>
                                <button type="button" role="option" data-chart-type="doughnut">
                                    <img src="icons/chart-doughnut.svg" alt="" />
                                    <span>Halka</span>
                                </button>
                                <button type="button" role="option" data-chart-type="radar">
                                    <img src="icons/chart-radar.svg" alt="" />
                                    <span>Radar</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    <label class="chart-settings-field">
                        <span>Etiket Alanı</span>
                        <input id="chart-settings-label-range" type="text" placeholder="A1:A5" />
                    </label>
                    <label class="chart-settings-field">
                        <span>Veri Alanı</span>
                        <input id="chart-settings-value-range" type="text" placeholder="B1:B5" />
                    </label>
                    <label class="chart-settings-check">
                        <input id="chart-settings-gridlines" type="checkbox" checked />
                        <span>Kılavuz çizgilerini göster</span>
                    </label>
                    <label class="chart-settings-check">
                        <input id="chart-settings-trendline" type="checkbox" checked />
                        <span>Eğilim çizgisini göster</span>
                    </label>
                    <div id="chart-settings-axis-bounds" class="chart-settings-axis-bounds" hidden>
                        <div class="chart-settings-axis-grid">
                            <label class="chart-settings-field">
                                <span>Yatay Alt Sınır</span>
                                <input id="chart-settings-x-min" type="text" inputmode="decimal" placeholder="Otomatik" />
                            </label>
                            <label class="chart-settings-field">
                                <span>Yatay Üst Sınır</span>
                                <input id="chart-settings-x-max" type="text" inputmode="decimal" placeholder="Otomatik" />
                            </label>
                            <label class="chart-settings-field">
                                <span>Dikey Alt Sınır</span>
                                <input id="chart-settings-y-min" type="text" inputmode="decimal" placeholder="Otomatik" />
                            </label>
                            <label class="chart-settings-field">
                                <span>Dikey Üst Sınır</span>
                                <input id="chart-settings-y-max" type="text" inputmode="decimal" placeholder="Otomatik" />
                            </label>
                        </div>
                    </div>
                </div>
            </aside>
        </section>

        <section id="sheet-tabs">
            <button class="sheet-tab active" type="button">Sayfa1</button>
        </section>

        <a id="made-signature" href="https://www.madematik.com" target="_blank" rel="noopener noreferrer">
            <span>m</span><span class="made-highlight">ADEM</span><span>atik</span>
        </a>
    </main>

    <input id="open-file-input" class="hidden-file-input" type="file" accept=".avc,application/json" />

    <div id="context-menu" hidden>
        <button type="button" data-action="cut">
            <img src="icons/cut.svg" alt="" />
            <span>Kes</span>
        </button>
        <button type="button" data-action="copy">
            <img src="icons/copy.svg" alt="" />
            <span>Kopyala</span>
        </button>
        <button type="button" data-action="paste">
            <img src="icons/paste.svg" alt="" />
            <span>Yapıştır</span>
        </button>
        <hr>
        <button type="button" data-action="insert-row-above">
            <img src="icons/addrowup.svg" alt="" />
            <span>Üste satır ekle</span>
        </button>
        <button type="button" data-action="insert-row-below">
            <img src="icons/addrowdown.svg" alt="" />
            <span>Alta satır ekle</span>
        </button>
        <button type="button" data-action="delete-row">
            <img src="icons/delrow.svg" alt="" />
            <span>Satır sil</span>
        </button>
        <button type="button" data-action="insert-col-left">
            <img src="icons/addcolleft.svg" alt="" />
            <span>Sola sütun ekle</span>
        </button>
        <button type="button" data-action="insert-col-right">
            <img src="icons/addcolright.svg" alt="" />
            <span>Sağa sütun ekle</span>
        </button>
        <button type="button" data-action="delete-col">
            <img src="icons/delcol.svg" alt="" />
            <span>Sütun sil</span>
        </button>
        <button type="button" data-action="hide-axis">
            <img src="icons/eye-off.svg" alt="" />
            <span>Seçili satırları/sütunları gizle</span>
        </button>
        <button type="button" data-action="show-axes">
            <img src="icons/eye.svg" alt="" />
            <span>Gizli satırları/sütunları göster</span>
        </button>
        <button type="button" data-action="freeze-axis">
            <img src="icons/freeze-pane.svg" alt="" />
            <span>Seçili satırı/sütunu dondur</span>
        </button>
        <hr>
        <button type="button" data-action="add-sheet">
            <img src="icons/sheet-add.svg" alt="" />
            <span>Sayfa ekle</span>
        </button>
        <button type="button" data-action="duplicate-sheet">
            <img src="icons/sheet-duplicate.svg" alt="" />
            <span>Sayfayı çoğalt</span>
        </button>
        <button type="button" data-action="rename-sheet">
            <img src="icons/rename.svg" alt="" />
            <span>Ad değiştir</span>
        </button>
        <button type="button" data-action="delete-sheet">
            <img src="icons/sheet-delete.svg" alt="" />
            <span>Sayfa sil</span>
        </button>
        <hr>
        <button type="button" data-action="clear">
            <img src="icons/clear.svg" alt="" />
            <span>Hücreleri temizle</span>
        </button>
        <button type="button" data-action="note">
            <img src="icons/note.svg" alt="" />
            <span>Not ekle</span>
        </button>
    </div>

    <div id="border-menu" class="toolbar-menu" hidden>
        <button type="button" data-border-action="all" title="Tüm kenarlıklar">
            <img src="icons/border-all.svg" alt="" />
        </button>
        <button type="button" data-border-action="outer" title="Dış kenarlık">
            <img src="icons/border-outer.svg" alt="" />
        </button>
        <button type="button" data-border-action="inner" title="İç kenarlık">
            <img src="icons/border-inner.svg" alt="" />
        </button>
        <button type="button" data-border-action="top" title="Üst kenarlık">
            <img src="icons/border-top.svg" alt="" />
        </button>
        <button type="button" data-border-action="bottom" title="Alt kenarlık">
            <img src="icons/border-bottom.svg" alt="" />
        </button>
        <button type="button" data-border-action="left" title="Sol kenarlık">
            <img src="icons/border-left.svg" alt="" />
        </button>
        <button type="button" data-border-action="right" title="Sağ kenarlık">
            <img src="icons/border-right.svg" alt="" />
        </button>
        <button type="button" data-border-action="clear" title="Kenarlıkları temizle">
            <img src="icons/border-clear.svg" alt="" />
        </button>
    </div>

    <div id="number-format-menu" class="number-format-menu" hidden>
        <button type="button" data-number-format="automatic">
            <span class="menu-check" aria-hidden="true">✓</span>
            <span>Düz Metin</span>
        </button>
        <button type="button" data-number-format="number">
            <span class="menu-check" aria-hidden="true">✓</span>
            <span>Sayı</span>
            <span class="number-format-example">123.00</span>
        </button>
        <button type="button" data-number-format="date">
            <span class="menu-check" aria-hidden="true">✓</span>
            <span>Tarih</span>
            <span class="number-format-example">01.01.1900</span>
        </button>
        <button type="button" data-number-format="time">
            <span class="menu-check" aria-hidden="true">✓</span>
            <span>Saat</span>
            <span class="number-format-example">19:59:00</span>
        </button>
    </div>

    <div id="zoom-menu" class="zoom-menu" hidden>
        <button type="button" data-zoom-value="50">50%</button>
        <button type="button" data-zoom-value="75">75%</button>
        <button type="button" data-zoom-value="90">90%</button>
        <button type="button" data-zoom-value="100">100%</button>
        <button type="button" data-zoom-value="125">125%</button>
        <button type="button" data-zoom-value="150">150%</button>
        <button type="button" data-zoom-value="200">200%</button>
    </div>

    <div id="filter-popup" class="filter-popup" hidden>
        <div id="filter-popup-title" class="filter-popup-title">Filtre</div>
        <input id="filter-popup-input" type="search" placeholder="Değer gir" autocomplete="off" />
        <div class="filter-popup-actions">
            <button id="filter-popup-clear-btn" type="button">Temizle</button>
            <button id="filter-popup-apply-btn" type="button">Tamam</button>
        </div>
    </div>

    <script src="vendor/chart.js"></script>
    <script src="app.js"></script>
</body>

</html>
